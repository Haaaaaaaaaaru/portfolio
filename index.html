<!DOCTYPE html>
<html lang="ja">
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Haru Okabe</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="site-header">
            <a href="#top">Haru Okabe</a>

                <img src="media/top.jpeg" width="80%">

        <footer>
            <span>© 2026 Haru Okabe</span>
